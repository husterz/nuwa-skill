name: Sync upstream to Gitee

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alchaincyf/nuwa-skill.git
          git fetch upstream --tags
          git merge --ff-only upstream/main
          git push origin HEAD:main --tags
      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git push "https://sjbsg_0:${GITEE_TOKEN}@gitee.com/sjbsg/nuwa-skill.git" HEAD:main --tags
